services:
  backend:
    build: .
    env_file:
      - .env
    volumes:
      - .:/app
      - static_volume:/vol/static
      - media_volume:/vol/media
    depends_on:
      - db
      - redis
    networks:
      - webnet

  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - webnet

  redis:
    image: redis:7
    restart: always
    networks:
      - webnet

  celery:
    build: .
    command: celery -A config worker -l info
    env_file:
      - .env
    volumes:
      - .:/app
      - static_volume:/vol/static
    depends_on:
      - db
      - redis
    networks:
      - webnet

  celery-beat:
    build: .
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      - db
      - redis
    networks:
      - webnet

  nginx:
    image: nginx:stable
    ports:
      - "80:80"
    volumes:
      - static_volume:/vol/static
      - media_volume:/vol/media
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - webnet

volumes:
  postgres_data:
  static_volume:
  media_volume:

networks:
  webnet:
    driver: bridge
